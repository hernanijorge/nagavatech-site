server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 256;

    error_page 404 /404.html;

    # Short cache + always revalidate: a 30-day cache here meant any update
    # to css/js/images stayed invisible to returning visitors for up to a
    # month, hard-refresh notwithstanding. Static files are small/few here,
    # so freshness after every deploy matters more than shaving requests.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|woff2?)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
